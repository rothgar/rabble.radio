# Deploy rabble.rodeo on every push to main: the web app and API on
# Cloudflare Workers, the Android APK to R2 (served at /downloads/), and the
# iOS build to TestFlight. Each part runs only when its files changed; a
# manual run (workflow_dispatch) picks parts explicitly. See docs/DEPLOY.md
# for the secrets and variables this needs. Production (rabble.radio) is
# deploy-production.yml, on `v*` tags.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web:
        description: Deploy the web app and API
        type: boolean
        default: true
      android:
        description: Build and publish the Android APK
        type: boolean
        default: true
      ios:
        description: Archive and upload the iOS app to TestFlight
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.pick.outputs.web }}
      android: ${{ steps.pick.outputs.android }}
      ios: ${{ steps.pick.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_WEB: ${{ inputs.web }}
          IN_ANDROID: ${{ inputs.android }}
          IN_IOS: ${{ inputs.ios }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            web=$IN_WEB; android=$IN_ANDROID; ios=$IN_IOS
          elif [ -n "$BEFORE" ] && [[ "$BEFORE" != 0000000000* ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            web=false; android=false; ios=false
            while IFS= read -r f; do
              case "$f" in
                android/*) android=true ;;
                ios/*) ios=true ;;
                .github/workflows/deploy.yml) web=true; android=true; ios=true ;;
                docs/*|k8s/*|kanban/*|redesign/*|.discobox/*|.claude/*|.kimchi/*|*.md|TODO.md) ;;
                *) web=true ;;
              esac
            done < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            # First push or a force-push with no common history: do everything.
            web=true; android=true; ios=true
          fi
          echo "web=$web android=$android ios=$ios"
          printf 'web=%s\nandroid=%s\nios=%s\n' "$web" "$android" "$ios" >> "$GITHUB_OUTPUT"

  web:
    name: Web and API (Cloudflare Workers)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      previous: ${{ steps.live.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Typecheck, lint, test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Record the live version (rollback target)
        id: live
        run: |
          version=$(pnpm exec wrangler deployments list --json | jq -r 'max_by(.created_on).versions[0].version_id // empty')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "live before this deploy: ${version:-unknown}"
      - name: Apply D1 migrations
        run: pnpm d1:migrate:remote
      - name: Build and deploy the Worker
        run: pnpm cf:deploy
      - name: Smoke test
        id: smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://rabble.rodeo/api/health; then exit 0; fi
            sleep 10
          done
          echo "rabble.rodeo did not answer /api/health after the deploy" >&2
          exit 1
      # The new version is live but not answering: put the previous one back.
      # Migrations are not undone (they are additive by convention), and main
      # keeps the commit, so the fix is forward: fix-ci / the QA issue.
      - name: Roll back to the previous version
        if: failure() && steps.smoke.outcome == 'failure' && steps.live.outputs.version != ''
        run: |
          pnpm exec wrangler rollback "${{ steps.live.outputs.version }}" -y --message "deploy.yml ${GITHUB_SHA::7}: smoke test failed"

  qa:
    name: Live-site checks
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check rabble.rodeo
        id: qa
        run: |
          if node scripts/qa-live.mjs --json > qa.json; then
            echo failed=0 >> "$GITHUB_OUTPUT"
          else
            echo failed=1 >> "$GITHUB_OUTPUT"
          fi
          node scripts/qa-live.mjs || true
      - name: Open or update the QA issue
        if: steps.qa.outputs.failed == '1'
        run: |
          title="QA: live-site checks failing after deploy"
          {
            echo "**Where:** https://rabble.rodeo, checked by \`scripts/qa-live.mjs\` after deploying ${GITHUB_SHA::7}"
            echo "**Observed:**"
            node -e 'for (const c of require("./qa.json").checks) if (!c.ok) console.log(`- ${c.name}: ${c.detail}`)'
            echo "**Expected:** every check passes (run the script locally to reproduce)"
            echo "**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          num=$(gh issue list --label qa --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "$title" --label bug --label qa --body-file body.md
          fi
          exit 1

  # The deploy answered /api/health but the live-site checks failed: put the
  # previous version back and say so on the QA issue. The commit stays on
  # main; the factory fixes forward and the next deploy carries everything.
  rollback:
    name: Roll back (live-site checks failed)
    needs: [web, qa]
    if: always() && needs.web.result == 'success' && needs.qa.result == 'failure' && needs.web.outputs.previous != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.web.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roll rabble.rodeo back
        run: |
          pnpm exec wrangler rollback "$PREVIOUS" -y --message "deploy.yml ${GITHUB_SHA::7}: live-site checks failed"
      - name: Note it on the QA issue
        run: |
          num=$(gh issue list --label qa --state open --search "\"QA: live-site checks failing after deploy\" in:title" --json number --jq '.[0].number')
          [ -n "$num" ] && gh issue comment "$num" --body "Rolled rabble.rodeo back to the previous Worker version ($PREVIOUS). ${GITHUB_SHA::7} stays on main; fix forward and the next deploy carries it." || true

  android:
    name: Android APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Refresh the SDK command-line tools
        # The runner's bundled sdkmanager predates API 37, so AGP's own SDK
        # download (licenses are pre-accepted on GitHub runners) fetches the
        # platform and build-tools; a current cmdline-tools keeps that path
        # working.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --update >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest" >/dev/null 2>&1 || true
      - name: Use the shared debug keystore
        # Without it every runner signs with a fresh key and phones refuse to
        # upgrade an installed build. Optional; see docs/DEPLOY.md.
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rabble-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish to rabble.rodeo/downloads/rabble-android.apk
        run: |
          pnpm exec wrangler r2 object put rabble-dev-recordings/builds/rabble-android.apk \
            --remote --file android/app/build/outputs/apk/debug/app-debug.apk \
            --content-type application/vnd.android.package-archive

  ios:
    name: iOS (TestFlight)
    needs: changes
    # Off until the IOS_TESTFLIGHT repository variable is "true" and the
    # App Store Connect secrets exist; see docs/DEPLOY.md.
    if: needs.changes.outputs.ios == 'true' && vars.IOS_TESTFLIGHT == 'true'
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick the newest Xcode on a GitHub-hosted runner
        if: vars.IOS_RUNNER == ''
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Install the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and upload
        working-directory: ios
        env:
          RABBLE_CI: "1"
          ASC_ENV_FILE: /dev/null
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: scripts/testflight.sh
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  ios-tests:
    name: iOS (XCUITest)
    needs: changes
    # Independent of IOS_TESTFLIGHT: this runs whether or not TestFlight
    # upload is turned on. Only gates pushes to main, like every other job
    # here (see docs/DEPLOY.md) — the repository has no pull_request CI.
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick the newest Xcode on a GitHub-hosted runner
        if: vars.IOS_RUNNER == ''
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Seed a local D1 with demo data
        run: |
          pnpm d1:migrate:local
          node scripts/seed-demo.mjs --local
      - name: Start a local LiveKit dev server for the suite to join
        # The join route's createRoom() (src/lib/livekit.ts) calls out to
        # LIVEKIT_URL before it ever mints a token, and ShowModel.swift's
        # lkRoom.connect() does too once the app has the token: both need a
        # real LiveKit reachable, not just a dev-mode API key/secret pair.
        # `--dev` uses the devkey/secret keypair below by default. A TCP
        # connect, not an HTTP request, checks readiness (and whether one is
        # already up) to match what this repo already trusts for this
        # service (k8s/livekit.yaml's readinessProbe); only the Next.js
        # server and the Simulator, both on this same host, need to reach
        # it, so it's bound to loopback only. Skips starting a second
        # instance if something is already listening on 7880 — a
        # self-hosted runner's own persistent LiveKit (docs/DEPLOY.md,
        # IOS_RUNNER) is left alone rather than fought over the port.
        run: |
          listening() { (exec 3<>/dev/tcp/127.0.0.1/7880) 2>/dev/null; }
          if listening; then
            echo "already listening on 7880, not starting our own"
            exit 0
          fi
          brew install livekit
          livekit-server --dev --bind 127.0.0.1 > /tmp/livekit.log 2>&1 &
          echo $! > /tmp/livekit.pid
          for i in $(seq 1 30); do
            listening && exit 0
            sleep 1
          done
          echo "livekit-server did not come up after 30s" >&2
          cat /tmp/livekit.log
          exit 1
      - name: Start a dev server for the suite to join
        # RabbleUITests needs a server seeded with demo data (ios/README.md,
        # "UI tests") and the LiveKit dev server above.
        run: |
          cat > .env.local <<ENV
          SESSION_SECRET=$(openssl rand -hex 32)
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          LIVEKIT_URL=ws://127.0.0.1:7880
          LIVEKIT_PUBLIC_URL=ws://localhost:7880
          LIVEKIT_API_KEY=devkey
          LIVEKIT_API_SECRET=secret
          ENV
          pnpm dev --port 3000 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 5
          done
          echo "dev server did not answer /api/health after 150s" >&2
          cat /tmp/next-dev.log
          exit 1
      - name: Run the XCUITest suite
        working-directory: ios
        run: scripts/run-ui-tests.sh
      - name: Stop the dev server
        if: always()
        run: kill "$(cat /tmp/next-dev.pid 2>/dev/null)" 2>/dev/null || true
      - name: Stop the LiveKit dev server
        if: always()
        run: kill "$(cat /tmp/livekit.pid 2>/dev/null)" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rabble-ios-ui-tests-${{ github.sha }}
          path: ios/build/ui-tests.xcresult
          if-no-files-found: warn
