# XcodeGen spec (https://github.com/yonaskolb/XcodeGen), kept as the
# readable description of the target. A hand-maintained Rabble.xcodeproj that
# matches it is committed so the app builds without XcodeGen; regenerate from
# this file if the two drift (`xcodegen generate`).
name: Rabble
options:
  bundleIdPrefix: radio.rabble
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9T45PRDLM6
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Rabble:
    type: application
    platform: iOS
    sources: [Rabble]
    dependencies:
      - package: LiveKit
        product: LiveKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Rabble
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIAppFonts: [Fraunces72ptSoft-Black.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [radio.rabble.ios.reminders]
        NSMicrophoneUsageDescription: Rabble uses the microphone when you speak on stage.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        RabbleBaseURL: $(RABBLE_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: radio.rabble.ios
        RABBLE_BASE_URL: https://rabble.radio
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  RabbleUITests:
    type: ui-testing-bundle
    platform: iOS
    sources: [RabbleUITests]
    dependencies:
      - target: Rabble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: radio.rabble.ios.RabbleUITests
        TEST_TARGET_NAME: Rabble
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
