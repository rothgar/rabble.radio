# Deploy rabble.radio (production): the web app and API to the rabble-prod
# Worker, the Android APK built against rabble.radio to the production
# bucket, and a signed Play Store .aab as a build artifact. Runs when a `v*`
# tag is pushed, or by hand (Actions, Run workflow). Pushes to main never
# reach production; they deploy rabble.rodeo through deploy.yml. Setup and
# secrets: docs/DEPLOY.md, "Production".
name: Deploy production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web:
        description: Deploy the web app and API to rabble.radio
        type: boolean
        default: true
      android:
        description: Build the Android APK against rabble.radio and publish it
        type: boolean
        default: true
      android_release:
        description: Build a signed Play Store .aab against rabble.radio
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: Web and API (rabble.radio)
    if: github.event_name == 'push' || inputs.web
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Typecheck, lint, test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Apply D1 migrations (rabble-prod)
        run: pnpm d1:migrate:prod
      - name: Build and deploy the rabble-prod Worker
        run: pnpm cf:deploy:prod
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://rabble.radio/api/health; then exit 0; fi
            sleep 10
          done
          echo "rabble.radio did not answer /api/health after the deploy" >&2
          exit 1

  android:
    name: Android APK (rabble.radio)
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Refresh the SDK command-line tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --update >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest" >/dev/null 2>&1 || true
      - name: Use the shared debug keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build against rabble.radio
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PrabbleBaseUrl=https://rabble.radio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rabble-android-production-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish to rabble.radio/downloads/rabble-android.apk
        run: |
          pnpm exec wrangler r2 object put rabble-prod-recordings/builds/rabble-android.apk \
            --remote --file android/app/build/outputs/apk/debug/app-debug.apk \
            --content-type application/vnd.android.package-archive

  android-release:
    name: Android Play Store bundle (.aab)
    if: github.event_name == 'push' || inputs.android_release
    runs-on: ubuntu-latest
    env:
      # Gates every step below: skipped (not failed) until the owner adds
      # this and the alias/password secrets. See docs/DEPLOY.md.
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Refresh the SDK command-line tools
        if: env.KEYSTORE_B64 != ''
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --update >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest" >/dev/null 2>&1 || true
      - name: Install the release keystore
        if: env.KEYSTORE_B64 != ''
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the signed .aab
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PrabbleBaseUrl=https://rabble.radio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.KEYSTORE_B64 != ''
        with:
          name: rabble-android-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove the keystore
        if: always() && env.KEYSTORE_B64 != ''
        run: rm -f "$RUNNER_TEMP/release.keystore"

  qa:
    name: Live-site checks (rabble.radio)
    needs: [web, android]
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check rabble.radio
        id: qa
        run: |
          if node scripts/qa-live.mjs --base https://rabble.radio --json > qa.json; then
            echo failed=0 >> "$GITHUB_OUTPUT"
          else
            echo failed=1 >> "$GITHUB_OUTPUT"
          fi
          node scripts/qa-live.mjs --base https://rabble.radio || true
      - name: Open or update the QA issue
        if: steps.qa.outputs.failed == '1'
        run: |
          title="QA: production checks failing after deploy"
          {
            echo "**Where:** https://rabble.radio, checked by \`scripts/qa-live.mjs --base https://rabble.radio\` after deploying ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
            echo "**Observed:**"
            node -e 'for (const c of require("./qa.json").checks) if (!c.ok) console.log(`- ${c.name}: ${c.detail}`)'
            echo "**Expected:** every check passes (run the script locally with --base to reproduce)"
            echo "**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          num=$(gh issue list --label qa --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "$title" --label bug --label qa --body-file body.md
          fi
          exit 1
