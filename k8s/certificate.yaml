# k8s/certificate.yaml
#
# OPTIONAL: cert-manager self-signed Certificate for `rabble.town`.
#
# This file is intentionally separate from k8s/ingress.yaml because:
#   1. cert-manager is not installed by default on kind.
#   2. TLS is not strictly required to run the MVP locally (HTTP-only is
#      fine for the OAuth loopback flow used in dev).
#
# If you want TLS on kind:
#   1. Install cert-manager:
#        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   2. Wait for the cert-manager pods:
#        kubectl -n cert-manager rollout status deploy/cert-manager --timeout=180s
#   3. Create the self-signed ClusterIssuer below (or apply this file, it
#      includes a minimal ClusterIssuer), then apply this Certificate.
#   4. Uncomment the `tls:` block in k8s/ingress.yaml.
#
# In production:
#   - Use Let's Encrypt (`cert-manager.io/issuer: letsencrypt-prod`) with a
#     real DNS-01 or HTTP-01 challenge against your public hostname.
#   - Never commit the resulting Secret - cert-manager creates it for you.

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bluesky-spaces-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bluesky-spaces-local
  namespace: bluesky-spaces
spec:
  # Use this Secret name in Ingress.spec.tls[].secretName.
  secretName: bluesky-spaces-tls
  issuerRef:
    # Must match the ClusterIssuer above.
    name: bluesky-spaces-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  # Common name / SAN for the local dev hostname. Add additional
  # dnsNames if you also want to reach the app via localhost / 127.0.0.1.
  commonName: rabble.town
  dnsNames:
    - rabble.town
  duration: 8760h      # 1 year; cert-manager will renew ~30 days before.
  renewBefore: 720h    # 30 days
