# k8s/cert-manager/cluster-issuer-production.yaml
#
# Let's Encrypt **production** ClusterIssuer for the rabble cluster.
#
# Use this once DNS-01 validation has been verified with the staging issuer.
# Production certificates are trusted by browsers.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/name: rabble
    app.kubernetes.io/part-of: rabble
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@rabble.town
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            email: admin@rabble.town
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
