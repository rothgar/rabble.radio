# k8s/secret.example.yaml
#
# Example Kubernetes Secret for the Bluesky Spaces app. Copy to
# k8s/overlays/production/secret.yaml (or wherever your environment expects
# it) and fill in the real values. NEVER commit the real Secret.
#
# Generate a SESSION_SECRET with:
#   openssl rand -hex 32
#
# Generate JWKS_PRIVATE_KEY with:
#   pnpm gen:jwks                 # writes ./jwks.json and ./private-key.pem
#   # then strip the PEM headers and base64-encode the body, OR pass the
#   # file directly as a value (Kubernetes Secrets accept multi-line
#   # stringData).
#
# The JWKS_PUBLIC_KEY (optional) is served from /api/auth/bluesky/jwks.json
# so the PDS can validate client assertions. If you host the JWKS at a
# public URL instead, set JWKS_URI instead of embedding the JWKS.
#
# DATABASE_URL:
#   Production points at a managed Postgres (RDS / Cloud SQL / etc.) over
#   TLS. The example below uses the in-cluster Postgres for the kind
#   overlay; switch to the managed URL when copying into production.
#
# LIVEKIT_*:
#   Must match the values baked into the LiveKit ConfigMap
#   (k8s/livekit.yaml -> livekit-config). For production these should live
#   in their own Secret referenced by `envFrom` on the livekit Deployment.

apiVersion: v1
kind: Secret
metadata:
  name: bluesky-spaces-secrets
  namespace: bluesky-spaces
type: Opaque
stringData:
  # 64 hex chars (32 bytes) recommended. Required.
  SESSION_SECRET: "replace-me-with-64-hex-chars-from-openssl-rand-hex-32"

  # The public URL where this deployment is reachable. Used to derive the
  # OAuth client_id. Required in production. Example:
  #   https://spaces.example.com
  PUBLIC_URL: "https://spaces.example.com"

  # PEM-encoded PKCS#8 private key (multi-line OK in stringData). Used for
  # private_key_jwt client authentication. Required in production.
  JWKS_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-CONTENTS-OF-private-key.pem
    -----END PRIVATE KEY-----

  # Optional. JSON Web Key Set served at /.well-known/jwks.json. If unset,
  # the app loads the keyset from JWKS_PRIVATE_KEY at startup.
  JWKS_PUBLIC_KEY: |
    {
      "keys": []
    }

  # Optional. Override the auto-derived client_id. Defaults to
  # ${PUBLIC_URL}/oauth-client-metadata.json. Set this if you host the
  # metadata document at a different URL.
  BLUESKY_OAUTH_CLIENT_ID: ""

  # Optional. Override the auto-derived redirect URI. Defaults to
  # ${PUBLIC_URL}/api/auth/bluesky/callback.
  BLUESKY_OAUTH_REDIRECT_URI: ""

  # ---------- LiveKit ----------
  # Must match k8s/livekit.yaml LIVEKIT_KEYS (devkey:devsecret...).
  # In production rotate these and store in a dedicated Secret.
  LIVEKIT_API_KEY: "devkey"
  LIVEKIT_API_SECRET: "devsecret0123456789abcdef0123456789abcdef"
  # WebSocket URL the server uses to mint tokens and to talk to the SFU.
  # For in-cluster use this; for split deployments point at the public
  # LiveKit URL (wss://livekit.example.com).
  # Use the cluster FQDN with a trailing dot so host DNS search domains are not
  # appended when running in kind / Docker.
  LIVEKIT_URL: "ws://livekit.bluesky-spaces.svc.cluster.local.:7880"

  # ---------- Database ----------
  # Production example:
  #   postgresql://bluesky:%PASSWORD%@db.example.internal:5432/bluesky_spaces?schema=public&sslmode=require
  DATABASE_URL: "postgresql://bluesky:bluesky@postgres.bluesky-spaces.svc.cluster.local.:5432/bluesky_spaces?schema=public"
