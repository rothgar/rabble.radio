apiVersion: batch/v1
kind: Job
metadata:
  name: rabble-migrate
  namespace: bluesky-spaces
  labels:
    app: rabble-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: rabble-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              # Use the cluster FQDN and a short connect timeout so the probe
              # does not hang if DNS or the port is temporarily unreachable.
              # Trailing dot prevents the host's DNS search domains from being
              # appended (e.g. .jgarr.net), which would resolve to a public IP.
              PG_HOST="postgres.bluesky-spaces.svc.cluster.local."
              until nc -w 2 -z "${PG_HOST}" 5432; do
                echo "postgres not ready yet"; sleep 3
              done
              echo "postgres is ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: rabble-migrate
          image: rabble:local
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - "node_modules/.bin/prisma db push --accept-data-loss --skip-generate"
          env:
            - name: DATABASE_URL
              value: postgresql://bluesky:bluesky@postgres.bluesky-spaces.svc.cluster.local.:5432/bluesky_spaces?schema=public
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
