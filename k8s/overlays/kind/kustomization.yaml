apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bluesky-spaces
resources:
  - ../../base
  # NOTE: k8s/ingress.yaml is applied separately by scripts/dev-cluster.sh
  # rather than listed here. Listing it here would force kustomize to
  # reconcile the relative `../livekit.yaml` reference inside the base
  # kustomization, which trips up kustomize's resource accumulator.
